<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" role="img" aria-labelledby="t1">
  <title id="t1">Portada de El silencio de la ciudad blanca</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2540"/>
      <stop offset="1" stop-color="#4a3a63"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" fill="url(#g1)"/>
  <rect x="12" y="12" width="176" height="276" fill="none" stroke="#ffffff" stroke-opacity=".35"/>
  <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="100" y="116" font-size="20" letter-spacing=".5">El silencio</text>
    <text x="100" y="150" font-size="20" letter-spacing=".5">de la ciudad</text>
    <text x="100" y="184" font-size="20" letter-spacing=".5">blanca</text>
  </g>
  <text x="100" y="266" fill="#ffffff" fill-opacity=".8" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">Eva García Sáenz de Urturi</text>
</svg>
